name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check prahari tests
      - run: mypy prahari
      # No network, no Earth Engine, no Gemini: synthetic layers and scripted AI.
      - run: pytest -m "not network and not gee" --cov=prahari --cov-report=term

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # typecheck + eslint + token lint for .css.ts + vitest (adapter, axe)
      - run: npm run check
      - run: npm run build
